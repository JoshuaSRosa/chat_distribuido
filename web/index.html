<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat FURG - Socket Puro</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        #app {
            max-width: 650px;
            margin: auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        #status {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            background: #e9ecef;
            color: #666;
        }

        .conn {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }

        .msg {
            padding: 6px 10px;
            margin: 5px 0;
            border-radius: 6px;
            background: #e7f3ff;
            font-size: 14px;
        }

        .sys {
            text-align: center;
            color: #888;
            font-style: italic;
            background: transparent;
        }

        #input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-right: 8px;
        }

        button {
            padding: 10px 16px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="status">Status: Conectando...</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="username" placeholder="Seu nome" style="width: 25%;">
            <input type="text" id="message" placeholder="Digite sua mensagem..."
                onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
